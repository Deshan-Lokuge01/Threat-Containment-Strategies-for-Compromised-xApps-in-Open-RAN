            "RIC_SUB_FAILURE",
            "RIC_INDICATION",
            "RIC_CONTROL_ACK",
            "RIC_CONTROL_FAILURE"
          ],
          "txMessages": [
            "RIC_SUB_REQ"
          ]
        }
      },
      "oran": {
        "xappType": "real-kpm-monitor",
        "serviceModel": "E2SM-KPM",
        "e2NodeId": "gnbd_001_001_00019b_0",
        "ranFunctionId": 2,
        "kpmReportStyle": 1,
        "metrics": [
          "DRB.UEThpUl",
          "DRB.UEThpDl"
        ],
        "submgrUri": "http://ztx-submgr-http.ricplt.svc.cluster.local:8088/ric/v1",
