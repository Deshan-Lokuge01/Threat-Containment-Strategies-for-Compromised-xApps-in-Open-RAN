# Source: kpm-monitor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpm-monitor
  namespace: ricxapp
  labels:
    app: kpm-monitor
    version: "1.0.0"
    zt-xguard.io/verified: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kpm-monitor
  template:
    metadata:
      labels:
        app: kpm-monitor
        version: "1.0.0"
        zt-xguard.io/verified: "true"
        zt-xguard.io/provider: "sp1"
    spec:
      serviceAccountName: kpm-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: spiffe-socket
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: svid-data
          emptyDir: {}
        - name: xapp-profile
          configMap:
            name: kpm-monitor-profile
      initContainers:
        - name: fetch-svid
          image: localhost:5000/spire-fetcher:1.0-nonroot
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for SPIRE socket..."
              while [ ! -S /var/run/spire/sockets/spire-agent.sock ]; do sleep 1; done
              echo "Socket ready. Fetching SVID..."
              /opt/spire/bin/spire-agent api fetch x509 \
                -socketPath /var/run/spire/sockets/spire-agent.sock \
                -write /svid-data
              echo "SVID fetched successfully."
              ls -l /svid-data || true
          volumeMounts:
            - name: spiffe-socket
              mountPath: /var/run/spire/sockets
              readOnly: true
            - name: svid-data
              mountPath: /svid-data
      containers:
        - name: kpm-monitor
          image: localhost:5000/zt-kpm-monitor:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
            - name: rmr
              containerPort: 4560
              protocol: TCP
          env:
            - name: XAPP_PROFILE_PATH
              value: /etc/xapp-profile/profile.json
            - name: XAPP_PORT
              value: "8092"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_HTTP_HOST
              value: "kpm-monitor.ricxapp"
            - name: SERVICE_HTTP_PORT
              value: "8092"
            - name: HTTP_PORT
              value: "8092"
            - name: RMR_PORT
              value: "4560"
            - name: SUBMGR_URI
              value: "http://ztx-submgr-http.ricplt.svc.cluster.local:8088/ric/v1"
            - name: E2MGR_NODEB_STATES_URL
              value: "http://service-ricplt-e2mgr-http.ricplt.svc.cluster.local:3800/v1/nodeb/states"
            - name: E2_NODE_ID
              value: "gnbd_001_001_00019b_0"
            - name: RAN_FUNCTION_ID
              value: "2"
            - name: KPM_REPORT_STYLE
              value: "1"
            - name: KPM_METRICS
              value: "DRB.UEThpUl,DRB.UEThpDl"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: svid-data
              mountPath: /etc/svid
              readOnly: true
            - name: xapp-profile
              mountPath: /etc/xapp-profile
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15

