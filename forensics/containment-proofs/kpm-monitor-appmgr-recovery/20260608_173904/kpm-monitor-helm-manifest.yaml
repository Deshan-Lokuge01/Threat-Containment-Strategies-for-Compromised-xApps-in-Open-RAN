        "initialDelaySeconds": 15,
        "periodSeconds": 15
      },
      "security": {
        "serviceAccount": "kpm-monitor",
        "spiffeID": "spiffe://example.org/ns/ricxapp/sa/kpm-monitor",
        "requiresSVID": true,
        "runAsNonRoot": true,
        "allowPrivilegeEscalation": false
      }
