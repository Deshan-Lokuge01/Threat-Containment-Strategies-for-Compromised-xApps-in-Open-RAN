            "reference": "localhost:5000/zt-resource-optimizer:1.0",
            "immutable_reference": "localhost:5000/zt-resource-optimizer@sha256:97f5c147a2d3d016916da5d968545b495f19ca4fe2c77b10c60dfa11bba50ce1"
          }
        }
      ],
      "messaging": {
        "ports": [
          {
            "name": "http_service",
            "container": "resource-optimizer",
            "port": 8080,
            "description": "HTTP API for health, profile, activity, RIC reachability, and metrics"
          }
        ]
      },
      "livenessProbe": {
        "httpGet": {
          "path": "/health",
          "port": 8080
        },
        "initialDelaySeconds": 5,
        "periodSeconds": 15
