apiVersion: v1
kind: Namespace
metadata:
  name: zt-xguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zt-xguard-evidence-pvc
  namespace: zt-xguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zt-xguard-policy-engine
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "serviceaccounts", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zt-xguard-policy-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zt-xguard-policy-engine
subjects:
  - kind: ServiceAccount
    name: zt-xguard-policy-engine
    namespace: zt-xguard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
  labels:
    app: zt-xguard-policy-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zt-xguard-policy-engine
  template:
    metadata:
      labels:
        app: zt-xguard-policy-engine
    spec:
      serviceAccountName: zt-xguard-policy-engine
      containers:
        - name: policy-engine
          image: localhost:5000/zt-xguard-policy-engine:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: XAPP_NAMESPACE
              value: ricxapp
            - name: TRUST_DOMAIN
              value: example.org
            - name: TRUSTED_PROVIDER
              value: sp1
            - name: APPROVED_REGISTRY_PREFIX
              value: localhost:5000/zt-
            - name: AUTO_QUARANTINE
              value: "false"
            - name: REVOKE_SPIRE
              value: "false"
            - name: SCAN_INTERVAL_SEC
              value: "0"
            - name: EVIDENCE_DIR
              value: /evidence
            - name: REQUEST_TIMEOUT
              value: "2.0"
            - name: ACTIVITY_TIMEOUT
              value: "2.0"
            - name: PROMETHEUS_URL
              value: "http://r4-infrastructure-prometheus-server.ricplt.svc.cluster.local:80"
            - name: PROMETHEUS_TIMEOUT
              value: "2.0"
            - name: XAPP_LIST
              value: telemetry-monitor,qos-optimizer,traffic-analyzer,resource-optimizer,security-observer
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: evidence
              mountPath: /evidence
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: zt-xguard-evidence-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
spec:
  type: ClusterIP
  selector:
    app: zt-xguard-policy-engine
  ports:
    - name: http
      port: 5000
      targetPort: http
