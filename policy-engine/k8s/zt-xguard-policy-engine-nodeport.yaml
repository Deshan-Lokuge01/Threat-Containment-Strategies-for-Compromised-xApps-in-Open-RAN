apiVersion: v1
kind: Service
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
  labels:
    app: zt-xguard-policy-engine
spec:
  type: NodePort
  selector:
    app: zt-xguard-policy-engine
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: http
      nodePort: 30500
