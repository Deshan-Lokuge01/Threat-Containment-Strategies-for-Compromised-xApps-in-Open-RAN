apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-monitor
  namespace: ricxapp
  labels:
    app: telemetry-monitor
    zt-xguard/component: custom-xapp
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: telemetry-monitor

  template:
    metadata:
      labels:
        app: telemetry-monitor
        zt-xguard/component: custom-xapp
        zt-xguard/profile: telemetry-monitor
        zt-xguard.io/svid-enabled: "true"
        security-status: trusted

    spec:
      serviceAccountName: telemetry-monitor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: spiffe-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true

        - name: svid-data
          emptyDir: {}

        - name: xapp-profile
          configMap:
            name: telemetry-monitor-profile

      initContainers:
        - name: fetch-svid
          image: docker.io/library/zt-spire-fetcher:1.0
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec

          args:
            - |
              SOCKET=/run/spire/sockets/spire-agent.sock
              OUTPUT=/etc/svid

              echo "Waiting for SPIRE socket..."

              for i in $(seq 1 60); do
                [ -S "$SOCKET" ] && break
                echo "Socket not ready: $i/60"
                sleep 2
              done

              test -S "$SOCKET"
              mkdir -p "$OUTPUT"

              echo "Waiting for initial workload identity..."

              for i in $(seq 1 60); do
                if /opt/spire/bin/spire-agent api fetch x509 \
                     -socketPath "$SOCKET" \
                     -write "$OUTPUT"
                then
                  chmod 0644 "$OUTPUT"/svid.0.pem
                  chmod 0600 "$OUTPUT"/svid.0.key
                  chmod 0644 "$OUTPUT"/bundle.0.pem

                  echo "SVID_FETCH_OK"
                  find "$OUTPUT" -maxdepth 1 -type f \
                    -printf '%f %s bytes\n' | sort
                  exit 0
                fi

                echo "Identity not ready: $i/60"
                sleep 2
              done

              echo "SVID_FETCH_FAILED"
              exit 1

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi

          volumeMounts:
            - name: spiffe-socket
              mountPath: /run/spire/sockets
              readOnly: true

            - name: svid-data
              mountPath: /etc/svid

      containers:
        - name: telemetry-monitor
          image: docker.io/library/zt-telemetry-monitor:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: XAPP_NAME
              value: telemetry-monitor

            - name: XAPP_PORT
              value: "8080"

            - name: XAPP_PROFILE_PATH
              value: /etc/xapp-profile/profile.json

            - name: XAPP_SVID_CERT
              value: /etc/svid/svid.0.pem

            - name: XAPP_SVID_KEY
              value: /etc/svid/svid.0.key

            - name: XAPP_SVID_BUNDLE
              value: /etc/svid/bundle.0.pem

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi

          volumeMounts:
            - name: xapp-profile
              mountPath: /etc/xapp-profile
              readOnly: true

            - name: svid-data
              mountPath: /etc/svid
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4

        - name: renew-svid
          image: docker.io/library/zt-spire-fetcher:1.0
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec

          args:
            - |
              SOCKET=/run/spire/sockets/spire-agent.sock
              OUTPUT=/etc/svid
              TMP=/tmp/svid-next

              while true; do
                rm -rf "$TMP"
                mkdir -p "$TMP"

                if /opt/spire/bin/spire-agent api fetch x509 \
                     -silent \
                     -socketPath "$SOCKET" \
                     -write "$TMP"
                then
                  cp "$TMP/svid.0.pem" "$OUTPUT/svid.0.pem.new"
                  cp "$TMP/svid.0.key" "$OUTPUT/svid.0.key.new"
                  cp "$TMP/bundle.0.pem" "$OUTPUT/bundle.0.pem.new"

                  chmod 0644 "$OUTPUT/svid.0.pem.new"
                  chmod 0600 "$OUTPUT/svid.0.key.new"
                  chmod 0644 "$OUTPUT/bundle.0.pem.new"

                  mv "$OUTPUT/svid.0.pem.new" "$OUTPUT/svid.0.pem"
                  mv "$OUTPUT/svid.0.key.new" "$OUTPUT/svid.0.key"
                  mv "$OUTPUT/bundle.0.pem.new" "$OUTPUT/bundle.0.pem"

                  echo "$(date -u +%FT%TZ) SVID_RENEW_OK"
                else
                  echo "$(date -u +%FT%TZ) SVID_RENEW_FAILED"
                fi

                sleep 60
              done

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi

          volumeMounts:
            - name: spiffe-socket
              mountPath: /run/spire/sockets
              readOnly: true

            - name: svid-data
              mountPath: /etc/svid

---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-monitor
  namespace: ricxapp
  labels:
    app: telemetry-monitor
    zt-xguard/component: custom-xapp
spec:
  type: ClusterIP

  selector:
    app: telemetry-monitor

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
