apiVersion: v1
kind: Namespace
metadata:
  name: zt-xguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zt-xguard-policy-engine
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "namespaces"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zt-xguard-policy-engine
subjects:
- kind: ServiceAccount
  name: zt-xguard-policy-engine
  namespace: zt-xguard
roleRef:
  kind: ClusterRole
  name: zt-xguard-policy-engine
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zt-xguard-evidence-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /home/near-ric/Desktop/FYP/zt-xguard/evidence/policy-engine
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zt-xguard-evidence-pvc
  namespace: zt-xguard
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: zt-xguard-evidence-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
  labels:
    app: zt-xguard-policy-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zt-xguard-policy-engine
  template:
    metadata:
      labels:
        app: zt-xguard-policy-engine
    spec:
      serviceAccountName: zt-xguard-policy-engine
      containers:
      - name: policy-engine
        image: zt-xguard-policy-engine:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: XAPP_NAMESPACE
          value: "ricxapp"
        - name: TRUST_DOMAIN
          value: "example.org"
        - name: AUTO_QUARANTINE
          value: "true"
        - name: EVIDENCE_DIR
          value: "/evidence"
        - name: PROMETHEUS_URL
          value: "http://r4-infrastructure-prometheus-server.ricplt.svc.cluster.local:80"
        - name: PROMETHEUS_TIMEOUT
          value: "2.0"
        volumeMounts:
        - name: evidence
          mountPath: /evidence
      volumes:
      - name: evidence
        persistentVolumeClaim:
          claimName: zt-xguard-evidence-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zt-xguard-policy-engine
  namespace: zt-xguard
spec:
  selector:
    app: zt-xguard-policy-engine
  ports:
  - name: http
    port: 5000
    targetPort: 5000
