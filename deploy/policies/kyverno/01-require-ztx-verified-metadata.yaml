apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ztx-require-verified-xapp-metadata
  annotations:
    policies.kyverno.io/title: Require ZT-XGuard Verified xApp Metadata
    policies.kyverno.io/category: ZT-XGuard
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      xApps deployed into ricxapp must carry ZT-XGuard verification metadata
      generated by the SMO secure onboarding workflow.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-ztx-verified-labels-and-annotations
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - ricxapp
      validate:
        message: "Pods in ricxapp must include ZT-XGuard verified labels and digest annotations."
        pattern:
          metadata:
            labels:
              zt-xguard.io/verified: "true"
              zt-xguard.io/provider: "?*"
            annotations:
              zt-xguard.io/descriptor-sha256: "?*"
              zt-xguard.io/image-digest: "?*"
